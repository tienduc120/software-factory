# Cloud agent. Label an issue `agent` to have Claude implement it and open a draft PR, or
# mention @claude in an issue or PR comment to ask for a change. It can't push to main
# (ruleset) or merge (no tool for it); a human merges after ci, pr-title, and ai-review pass.
name: claude

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions: {}

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  # Never cancel a run that may be halfway through pushing a branch.
  cancel-in-progress: false

jobs:
  claude:
    # Filter before the job starts, so comments from strangers on a public repo cost nothing.
    if: >-
      vars.AGENTS_PAUSED != 'true' && (
        (github.event_name == 'issues' && github.event.label.name == 'agent') ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile

      - uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea # v1.0.241
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: agent
          branch_prefix: agent/
          additional_permissions: |
            actions: read
          # Exact pnpm commands only: a wildcard would let injected text run any package binary.
          claude_args: |
            --max-turns 80
            --allowedTools "Bash(pnpm install),Bash(pnpm verify),Bash(pnpm lint),Bash(pnpm lint:fix),Bash(pnpm format),Bash(pnpm typecheck),Bash(pnpm test),Bash(pnpm test:coverage),Bash(pnpm build),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr create --draft:*)"
            --append-system-prompt "Follow AGENTS.md and the skill it points to that fits the task (ship-issue for an issue). Run pnpm verify before every push. When you finish work on an issue, open a draft pull request with gh pr create --draft, a Conventional Commit title, and a body that fills every section of .github/pull_request_template.md and says Closes #<issue>."
