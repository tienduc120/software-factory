# Actions are pinned to commit SHAs; this keeps the pins current. Prefixes make the PR titles
# Conventional Commits, so they pass the pr-title check.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
