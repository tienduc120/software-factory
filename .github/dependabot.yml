# Keeps the pinned action SHAs and the factory's own tooling current. Prefixes make the PR
# titles Conventional Commits, so they pass the pr-title check.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      tooling:
        patterns: ['*']

  # The versions every new project starts with. The smoke test proves an update still passes.
  - package-ecosystem: npm
    directories:
      - /stacks/typescript
      - /stacks/typescript/starter
      - /stacks/typescript/hooks/lefthook
      - /stacks/typescript/hooks/husky
    schedule:
      interval: weekly
    versioning-strategy: increase
    commit-message:
      prefix: build
      include: scope
    groups:
      payload:
        patterns: ['*']
